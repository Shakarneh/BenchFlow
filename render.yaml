# Deployment description for Render.com -- infrastructure as CODE.
#
# The point: the live environment is defined in a file in the repository,
# reviewed like any other change, instead of existing only as settings
# someone once clicked in a web dashboard and nobody can reproduce.

services:
  - type: web
    name: benchflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates and stores it; it never touches git
      - key: DJANGO_DEBUG
        value: "false"
      # Django's createsuperuser --noinput reads these three. sync: false
      # means "ask me for the value in the dashboard" -- the password is
      # typed into Render, never written in this file or in git.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # The real hostname arrives via RENDER_EXTERNAL_HOSTNAME, which Render
      # sets itself. This is only a fallback for local/other environments.
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: benchflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: benchflow-redis
          property: connectionString

  - type: redis
    name: benchflow-redis
    plan: free
    ipAllowList: [] # reachable only from inside Render's private network

databases:
  - name: benchflow-db
    plan: free
    databaseName: benchflow
    user: benchflow
